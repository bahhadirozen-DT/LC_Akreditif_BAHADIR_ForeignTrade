name: Yapay Zeka Akreditif Denetim Motoru

on:
push:
branches:
- main
paths:
- 'DisTicaretRepo/YuklenenDosyalar/**'
workflow_dispatch:

permissions:
contents: write

jobs:
analiz_ve_raporlama:
runs-on: ubuntu-latest

```
steps:
  - name: Depoyu Bulut Sunucusuna Çek
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Python Ortamını Hazırla
    uses: actions/setup-python@v5
    with:
      python-version: "3.10"

  - name: Bağımlılıkları ve OCR Motorunu Kur
    run: |
      sudo apt-get update
      sudo apt-get install -y tesseract-ocr tesseract-ocr-tur tesseract-ocr-eng

      python -m pip install --upgrade pip

      if [ -f requirements.txt ]; then
        pip install -r requirements.txt
      fi

  - name: Akreditif Analiz Motorunu Çalıştır
    run: |
      python app.py

  - name: Git Kullanıcısını Tanımla
    run: |
      git config --global user.email "action@github.com"
      git config --global user.name "Yapay Zeka Otomasyonu"

  - name: Raporları Commit Et ve Pushla
    run: |
      rm -rf __pycache__ || true

      git fetch origin

      git add DisTicaretRepo/Raporlar/

      if git diff --cached --quiet; then
        echo "Rapor değişmedi."
        exit 0
      fi

      git commit -m "🤖 Otomatik Analiz Raporu Güncellendi [skip ci]"

      git pull --rebase origin main

      git push origin HEAD:main

  - name: Raporları Artifact Olarak Sakla
    uses: actions/upload-artifact@v4
    with:
      name: akreditif-analiz-raporlari
      path: |
        DisTicaretRepo/Raporlar/*.md
        DisTicaretRepo/Raporlar/*.html
        DisTicaretRepo/Raporlar/*.docx
      if-no-files-found: ignore
```
