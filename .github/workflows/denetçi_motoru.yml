name: Yapay Zeka Akreditif Denetim Motoru

on:
  push:
    branches:
      - main
    paths:
      - 'DisTicaretRepo/YuklenenDosyalar/**'
  workflow_dispatch:

# GitHub Actions'ın repoya yazma yetkisini açıkça tanımlıyoruz
permissions:
  contents: write

jobs:
  analiz_ve_raporlama:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Bulut Sunucusuna Çek
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Tüm geçmişi çek (rebase için gerekli)

    - name: Python Ortamını Hazırla
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları ve Tesseract OCR Motorunu Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-tur tesseract-ocr-eng
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Akreditif Analiz Motorunu Tetikle
      run: |
        python app.py

    - name: Üretilen Raporları Repoya Geri Yükle ve Güncelle
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Yapay Zeka Otomasyonu"
        
        # Değişiklikleri hazırla
        git add DisTicaretRepo/Raporlar/*
        
        # Değişiklik kontrolü
        if ! git diff --quiet || ! git diff --staged --quiet; then
          git commit -m "🤖 Otomatik Analiz Raporu Güncellendi [skip ci]"
          
          # Çakışmaları önlemek için rebase ile güncellemeleri çek
          git pull --rebase origin main
          
          # Push işlemini gerçekleştir
          git push origin main
        else
          echo "Güncellenecek rapor bulunamadı, işlem atlandı."
        fi
