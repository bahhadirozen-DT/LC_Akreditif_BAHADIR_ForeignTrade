name: Yapay Zeka Akreditif Denetim Motoru

on:
  push:
    branches:
      - main
    paths:
      - 'DisTicaretRepo/YuklenenDosyalar/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analiz_ve_raporlama:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Bulut Sunucusuna Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Ortamını Hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları ve Tesseract OCR Motorunu Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tur tesseract-ocr-eng
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Akreditif Analiz Motorunu Tetikle
        run: |
          python app.py

      - name: Üretilen Raporları Repoya Geri Yükle ve Güncelle
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Yapay Zeka Otomasyonu"

          # Eski yarım kalmış işlemleri temizle
          git rebase --abort || true
          git merge --abort || true

          # Raporları ekle
          git add DisTicaretRepo/Raporlar/

          # Değişiklik yoksa çık
          if git diff --cached --quiet; then
            echo "Rapor değişikliği yok."
            exit 0
          fi

          # Commit oluştur
          git commit -m "🤖 Otomatik Analiz Raporu Güncellendi [skip ci]"

          # En güncel main'i al
          git fetch origin main

          # Çakışma çıkarsa kendi commitini koru
          git rebase origin/main || true

          # Push
          git push origin HEAD:main
